<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京自由行 — 離線模式</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #fafafa;
      color: #334155;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 400px; }
    .emoji { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; color: #0f172a; }
    p { font-size: 0.95rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c0392b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🗼</div>
    <h1>目前處於離線狀態</h1>
    <p>無法連線到網路，但您之前瀏覽過的頁面仍可使用。<br>請檢查網路連線後再試一次。</p>
    <button onclick="location.reload()">重新載入</button>
  </div>
</body>
</html>
